[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[project]
name = "dev-pro-agents"
version = "0.1.0"
description = "A read-only LangGraph workflow that turns typed task briefs into implementation handoffs."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Bjorn Melin" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "langchain>=1.3.14,<2",
  "langchain-core>=1.4.9,<2",
  "langchain-openai>=1.3.5,<2",
  "langgraph>=1.2.9,<2",
  "langgraph-checkpoint>=4.1.1,<5",
  "langgraph-checkpoint-sqlite>=3.1.1,<4",
  "pydantic>=2.13.4,<3",
  "typer>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/BjornMelin/dev-pro-agents"
Repository = "https://github.com/BjornMelin/dev-pro-agents"
Issues = "https://github.com/BjornMelin/dev-pro-agents/issues"

[project.scripts]
dev-pro-agents = "dev_pro_agents.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.18.2,<2",
  "pytest>=9.1.1,<10",
  "ruff>=0.15.21,<0.16",
]

[tool.uv]
required-version = ">=0.11.28,<0.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
