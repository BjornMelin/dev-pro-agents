name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --python 3.14 --frozen --all-groups
      - run: uv lock --check
      - run: uv run --python 3.14 ruff check .
      - run: uv run --python 3.14 ruff format --check .
      - run: uv run --python 3.14 mypy src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --python ${{ matrix.python-version }} --frozen --all-groups
      - run: uv run --python ${{ matrix.python-version }} pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --python 3.14 --frozen --all-groups
      - run: uv build --python 3.14
      - name: Smoke-test wheel and CLI
        run: |
          wheel=$(find dist -name '*.whl' -print -quit)
          uv run --python 3.14 --isolated --no-project \
            --with "$wheel" python -c "import dev_pro_agents; print(dev_pro_agents.__name__)"
          uv run --python 3.14 --isolated --no-project \
            --with "$wheel" dev-pro-agents --help
